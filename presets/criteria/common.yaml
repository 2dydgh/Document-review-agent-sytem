# 모든 팀·모든 문서에 적용되는 기준. 층은 파일 위치가 정한다(library.py).
#
# ── 무엇이 공통인가 (2026-08-20 재정의) ──────────────────────────────
#
# **두 가지를 동시에 만족할 때만 공통이다.**
#
#   ① 두 실이 각각 요구했다.
#      AX안전신뢰실("문서 검증 요구사항" 시트)과 에너지인프라시스템실
#      ("EIS 문서 검증 요구사항" 시트) 양쪽에 근거가 있어야 한다. 한 실 안에서
#      여러 팀이 요구한 것은 그 실 얘기지 전 팀 공통이 아니다.
#
#   ② 팀이 값을 안 줘도 돈다.
#      필수 장절 목록·파일명 규칙·요건 ID 형식처럼 **팀마다 다른 값**이 있어야
#      도는 검사는 공통이 될 수 없다. 값 없는 공통 기준은 대부분의 팀에서
#      "검사하지 않았습니다"만 띄우고 아무 일도 안 한다.
#
# ── 왜 "요구사항 최종" 시트를 안 쓰나 ───────────────────────────────
#
# 예전 이 파일은 그 시트에서 **근거가 두 시트에 걸친 7건**을 가져왔다. 그런데
# 그 시트를 뜯어보니 **주제 목차**였다 — 요구 36건이 상세 76건을 빠짐없이
# 묶고 있고, 한 묶음 안의 상세들이 서로 다른 요구다. 예:
#
#   최종 No.15 "용어·약어 정의 및 사용 일관성"
#      [AI시험인증1팀] 용어 설명을 자동 **생성**해주는 기능      ← 만드는 일
#      [EV3]          약어 리스트를 **최신화**(추가/삭제)       ← 만드는 일
#      [EV2]          목록에 등록 안 된 용어를 **식별**          ← 검사
#
# 주제만 같고 성격이 다르니 mode 를 하나로 정할 수 없었다. 그래서 지금은
# **상세 시트 76건의 문구를 직접 읽어** 같은 검사를 요구한 것만 모은다.
#
# ── 옛 7건은 어디로 갔나 ────────────────────────────────────────────
#
#   최종 No.16 문서 내용 품질    → 여기 C1 로 살아남음
#   최종 No.13 표·그림 정합성    → 여기 C3
#   최종 No.15 용어·약어         → C2(목록 대조) + C4(같은 개념 다른 용어) 로 갈림
#   최종 No.9  필수 장절         → **팀으로.** 목록이 팀마다 다르다(조건 ② 위반)
#   최종 No.2  상위-하위 추적성   → **팀으로.** id_pattern 이 있어야 돈다(조건 ②)
#   최종 No.4  표준 적합성        → **팀으로.** 외부 표준 문서가 있어야 판정된다
#   최종 No.11 개정이력·개정바    → **보류.** 두 실이 요구한 건 맞지만 검사기가
#                                 아직 없다. 만들어지면 여기 올릴 후보다.
#
# ── 비용 ────────────────────────────────────────────────────────────
# LLM-문서 는 기준 하나당 문서 전체를 한 번씩 묻는다. 여기 2건이고, 팀 기준의
# LLM-문서 와 합산된다(AX품질팀은 13건이라 합계 15회). 공통에 LLM-문서 를 더
# 올릴 때는 모든 팀의 검토 시간이 함께 늘어난다는 것을 기억할 것.
name: 공통 기준
source_filename: DocSuree_요구사항_정리.xlsx
items:
- 'no': C1
  text: 오탈자·맞춤법·표현 오류
  group: 표현
  note: |-
    본문뿐 아니라 표·그림 제목·부록·평가표까지 본다. 오탈자, 띄어쓰기, 문법,
    같은 말 반복 입력, 조사 오류.
  # 두 실 3팀이 거의 같은 말을 했다:
  #   [AI시험인증1팀] "문서에 작성된 내용의 띄어쓰기, 문법, 오탈자 검토"
  #   [EV1]          "설계 산출물 및 V&V 산출물에 대해 오탈자나 문맥상 오류 점검"
  #   [EV2]          "본문, 표, 그림 제목, 부록, 평가표의 오탈자, 띄어쓰기 오류,
  #                   반복 입력, 조사 오류를 확인하는 행위를 자동화한다"
  # 팀 값이 필요 없다 — 맞춤법은 팀마다 다르지 않다.
  agent: 표현·내용품질
  mode: LLM-조각
  source: 문서검증 No.15 · EIS문서검증 No.11 · EIS문서검증 No.27
- 'no': C2
  text: 약어·용어 목록과 본문이 서로 맞는가
  group: 형식
  note: |-
    두 방향을 다 본다.
    1. 본문에 쓰였는데 약어 목록에 없는 것
    2. 목록에는 있는데 본문에서 쓰이지 않는 것 (삭제된 용어가 목록에 남음)
  # [EV3]  "약어 리스트의 약어를 전체 검색으로 검색하여 사용 여부 확인" (미사용분 삭제)
  # [EV2]  "본문에서 사용된 약어·전문용어 중 용어정의 또는 약어 목록에 등록되지
  #         않은 항목을 식별하고, 삭제된 용어가 본문에 남아 있는지 확인"
  #
  # **근거가 한 실에 치우쳐 있다(조건 ① 미달).** AX안전신뢰실 쪽 약어 요구
  # (AI시험인증1팀 문서검증 No.14)는 "용어 설명을 자동 생성"이라 성격이 다르다.
  # 그래도 여기 두는 것은 **우리 판단**이다: AbbrevChecker 가 이미 있고 값 없이
  # 돌며, 약어 목록을 둔 문서라면 실이 어디든 해당되기 때문이다. 팀이 "우리는
  # 아니다" 라고 하면 그쪽이 이긴다 — 그때 팀 기준으로 내린다.
  agent: 형식·완전성
  mode: 규칙
  check: abbrev
  source: EIS문서검증 No.2 · EIS문서검증 No.26
- 'no': C3
  text: 본문이 가리키는 표·그림이 실제와 맞는가
  group: 정합성
  note: |-
    본문에서 참조한 표 번호·그림 번호가 실제 표·그림 제목과 일치하는지,
    존재하지 않는 번호를 참조하거나 같은 번호가 두 번 쓰이지 않았는지 본다.
    표·그래프의 내용과 그것을 설명하는 문구가 어긋나는 경우도 함께 본다
    (예: 본문은 "이상"인데 표는 "초과", 본문은 "평균"인데 표는 "중앙값").
  # [AI신뢰성1팀] "표 혹은 그래프의 내용과 이를 설명하는 문구가 일치하는지 검토
  #                (예: 이상/초과/이하/미만 등 표현과 수치를 비교하거나,
  #                최소/최대/평균/중앙값 등의 표현…)"
  # [EV2]        "본문에서 참조하는 표 번호와 그림 번호가 실제 표·그림 제목과
  #               일치하는지 확인하고, 존재하지 않는 번호를 참조하거나 중복
  #               번호가 사용된 위치를 식별한다"
  #
  # 두 요구가 겹치는 것은 "본문과 표·그림이 어긋나는가"다. 앞은 내용, 뒤는
  # 번호를 말하는데 둘 다 문서의 **멀리 떨어진 두 곳**을 맞대야 한다.
  agent: 정합성·추적성
  mode: LLM-문서
  source: 문서검증 No.3 · EIS문서검증 No.35
- 'no': C4
  text: 같은 개념을 문서 안에서 다른 용어로 쓰지 않았는가
  group: 정합성
  note: |-
    같은 것을 가리키는 말이 문서 안에서 갈라져 쓰이는지 본다.
    예: 정확도 / 정확성 · AI / 인공지능 · Accuracy / 정확성
    표지·본문·표·그림·부록 사이의 명칭 불일치도 같은 문제다.
  # [AI시험인증1팀] "하나의 문서에서 같은 뜻의 단어를 여러 단어로 사용할 경우,
  #                 이를 식별 해주는 기능. Ex. 정확도, 정확성 / AI, 인공지능"
  # [EV2]          "동일 개념이 문서 내에서 서로 다른 용어로 사용되는지 확인하고,
  #                 표지·본문·표·그림·부록·Excel 원자료 간 명칭 불일치를 식별한다"
  #
  # 두 실이 거의 같은 문장을 썼다 — 후보 중 근거가 가장 확실하다.
  # C1(오탈자)과 가른 이유: 오탈자는 글자가 틀린 것이고 이것은 **글자는 맞는데
  # 말이 갈린 것**이다. 한 항목으로 묶으면 검토자가 둘을 구별하지 못한다.
  # 조각으로는 못 잡는다 — 3쪽의 "정확도"와 40쪽의 "정확성"은 다른 조각에 있다.
  agent: 정합성·추적성
  mode: LLM-문서
  source: 문서검증 No.23 · EIS문서검증 No.30
