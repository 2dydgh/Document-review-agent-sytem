# ── 추적성분석 (문서간 §2) ──────────────────────────────────────────────
- 'no': X-CVR05-01
  text: 시스템 요구사항 식별 완전성 (모든 시스템 요구사항이 개념문서 내에서 식별됨)
  group: 문서 간 대조
  note: |-
    개념 단계 추적성.

    요건 ID 형식은 아래 params 가 준다. 그것이 있어야 문서 간 추적성 검사
    (TraceabilityChecker · build_rtm)가 돈다 — 없으면 "요건 ID 형식이 검토
    기준에 없어 수행하지 않았습니다"로 뜬다.
  agent: 정합성·추적성
  mode: 사람
  source: VV_문서간 §2-1
  # ── 요건 ID 형식 ───────────────────────────────────────────────────
  # **문서가 스스로 선언한 부여규칙에서 옮겼다.** ACMD-AN-002 요구사항명세서의
  # "요구사항 식별자 부여규칙" 절이 이렇게 적고 있다:
  #
  #     RQ-종류코드-구성코드(2자리)-세부기술번호(2자리)-일련번호(3자리)
  #     식별자 사례: RQ-SFR-VP-01-001
  #
  # 문서에서 실제 쓰인 값을 훑어 정규식을 짜지 **않았다.** 그러면 문서에서 뽑은
  # 잣대로 그 문서를 재는 순환이 된다 — 옛 presets/checklists/acmd.yaml 이 바로
  # 그렇게 만들어졌다가 지워졌고, 그때 LLM 이 잡아낸 실제 결함(선언한 규칙과
  # 실제 형식의 불일치)을 정답으로 굳혀 놓았다(presets/README.md).
  #
  # 실측(2026-08-20, 문서 검토 샘플):
  #   ACMD-AN-002(SRS) 요건 32개 · ACMD-DS-005(SDD)가 인용한 것 10개
  #   → 추적성 지적 28건 · RTM 35행(linked/missing)이 실제로 나왔다.
  #
  # ── 이 정규식이 못 잡는 것 (알고 두는 한계) ──────────────────────
  # 1) **구성코드가 선택이다.** 두 문서 모두 "하위구성 코드는 … 필요한 경우에
  #    활용하고, 그렇지 않은 경우 하위구성 코드를 제외한다" 고 적었다. 그러면
  #    RQ-SFR-01-001 (4토막)도 규칙상 맞는데 이 정규식은 5토막만 잡는다.
  #    ACMD 샘플은 32개가 전부 5토막이라 지금은 문제가 없다. 4토막을 쓰는 과제가
  #    오면 ID 를 하나도 못 찾고, 그때는 TraceabilityChecker 가 "이 문서의 ID
  #    형식과 맞는지 확인하세요" 로 알린다 — 조용한 0건이 되지는 않는다.
  #
  # 2) **상세설계서의 선언 자체가 어긋나 있다.** ACMD-DS-005 는 형식을
  #    "RQ-종류코드-…" 라고 적어놓고 사례는 "DS-SED-VP-01-001" 을 든다(요구사항
  #    명세서 문구를 복사하며 접두사를 안 고친 것으로 보인다). 이 정규식은 RQ- 를
  #    잡으므로 **상위 요건과 그것을 인용한 하위 문서**를 짝짓는 데는 맞다 —
  #    설계 항목 자신의 ID(DS-*)는 추적 대상이 아니다(설계→소스코드 추적이
  #    필요해지면 그때 별도 패턴이 든다).
  #
  #    이 불일치 자체가 지적거리다. 옛 acmd.yaml 처럼 **실제 쓰인 형식**을 뽑아
  #    넣었다면 이것이 정답으로 굳어 영영 안 보였을 것이다.
  #
  # **이 값은 ACMD 과제의 규칙이다.** 품질팀은 과제마다 기준이 바뀐다(md §2.0
  # "과제별 서식 기준값 — 착수 시 1회 작성"). 다른 과제는 업로드 기준으로 덮는다
  # — 업로드 층이 팀 층보다 뒤에 합쳐지므로 그쪽 값이 이긴다.
  #
  # scope_pattern(이 설계서가 담당하는 요건 범위)은 여기 못 넣는다. 문서쌍마다
  # 다르다 — 위 실측의 28건 중 상당수가 "이 부분 설계서 범위 밖"이지 누락이
  # 아니다. 검토 요청 시 입력이어야 한다.
  params:
    id_pattern: 'RQ-[A-Z]{2,4}-[A-Z]{2}-\d{2}-\d{3}'
    id_example: RQ-SFR-PR-01-001
