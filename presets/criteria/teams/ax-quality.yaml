# AX품질팀 검토 기준
#
# **출처는 팀이 정리해 준 md 3건이다** (data/AX안전신뢰실/AX품질팀/).
#   VV_단일문서_검토요구사항.md          §2 서식 · §3 단계별 (IEEE 1012 §9.1~9.3)
#   VV_문서간_검토요구사항.md            §1 문서쌍 대조 · §2 추적성분석
#   VV_검토의견서_및_보고서_요구사항.md   산출물(검토의견서·V&V 보고서) 자체의 양식
#
# 요구사항 xlsx 에서 온 항목은 **정리했다**(2026-08-19). 그 시트에 있던 No.5~11 은
# 문서를 재는 잣대가 아니라 팀이 도구에 요구한 **기능**이었다(템플릿 출력·이력 통계·
# 추적성 분석표 생성). 검토 기준 목록에 섞여 있으면 "기준 N건" 이 실제로 문서를
# 검사하는 수를 말하지 않게 된다. 원본은 data/DocSuree_요구사항_정리.xlsx 에 남아 있다.
#
# 예외 하나 — No.9(미작성 항목)만 남겼다. 실제로 도는 규칙 검사이고(placeholder),
# **그 마커 목록(미정·미확인·TBD·TBC)은 md 어디에도 없다.** 버리면 지금 되는 검사가
# 사라진다. 팀이 md 에 옮겨 적어 주면 그때 source 를 바꾼다.
#
# **이 팀의 기준은 IEEE 1012-2016 이 원천이다.** 문서를 열어보고 거꾸로 뽑은 값이
# 아니라 외부 표준에서 온다 — 그래서 문서가 표준을 안 지키면 지적이 나온다.
#
# ── mode 를 정한 근거 ──────────────────────────────────────────────────
# md 대부분이 "검토자의 전문 지식으로 판정"이라고 스스로 적고 있다(§3-1 머리말).
# 도메인 판단·물리법칙·타당성은 문서 밖에 정답이 있어 `사람`이다. 지어낸 판정을
# 넣으면 이 도구가 낼 수 있는 최악의 거짓말이 된다.
#
# 도구가 실제로 할 수 있는 것만 규칙·LLM 으로 돌린다:
#   규칙      abbrev(약어 목록↔본문) · filename(파일명) · placeholder(미작성 표시)
#             reflist(참조문서 목록↔본문)
#   LLM-조각  문장 단위 판정 — 가독성·모호성·허용기준 유무
#   LLM-문서  멀리 떨어진 두 곳을 맞대야 하는 것 — 용어 일관성, 부록 A↔C 교차검증
#
# **LLM-문서 는 기준 하나당 문서 전체를 한 번씩 묻는다**(WholeDocCriteriaChecker._batches).
# 여기 13건 + 공통 2건 = 한 문서에 전체 호출 15회다(최대 3개 병렬 → 5라운드).
# **아직 실측하지 않았다.** 문서 1건 5분 목표를 넘길 수 있다 — 실측해서 넘치면
# 줄일 곳은 F2.3-1·F2.3-2(날짜·단위 표기)를 하나로 묶는 것부터다. 팀 체크리스트
# 줄을 임의로 합치는 것이라 실측 근거 없이 먼저 하지 않았다.
#
# ── 아직 못 채운 것 (팀 확인 필요) ────────────────────────────────────
# 1) §2.0 "과제별 서식 기준값" 표가 **비어 있다**(글꼴·문서번호 체계·페이지 번호
#    형식·템플릿 파일). md 스스로 "표가 비어 있으면 서식 검토를 수행하지 않는다"
#    고 적었으므로 params 를 비워 둔다 — 검사기가 "규칙이 검토 기준에 없어
#    검사하지 않았습니다"로 드러낸다. 과제 착수 시 값이 정해지므로 팀 기준이
#    아니라 **업로드 층 또는 검토 요청 입력**이 맞는 자리다.
# 2) (해결됨 2026-08-20) 요건 ID 형식은 X-CVR05-01 의 params 에 있다. 팀 샘플
#    문서(ACMD-AN-002)가 부여규칙을 본문에 선언해 둔 것을 옮겼다. 다만 그것은
#    **ACMD 과제의 규칙**이라, 다른 과제는 업로드 기준으로 덮어야 한다.
#    scope_pattern(이 설계서가 담당하는 요건 범위)은 여전히 검토 요청 시 입력이다.
# 3) 필수 장절(required_sections)은 전역 설정이라 여기 못 넣는다 — 이 팀은 대상
#    문서가 ConOps·SRS/IRS·SDD/IDD·검토의견서·보고서로 여럿이고 장절이 서로 다르다.
#    문서 종류별로 나누려면 기준에 "어느 문서에 적용되나" 축이 필요하다(현재 없음).
name: AX품질팀
team: AX품질팀
source_filename: DocSuree_요구사항_정리.xlsx

# ── 문서 종류 판별 ──────────────────────────────────────────────────
#
# 이 팀은 산출물이 여럿이고(개념·요구사항·설계·검토의견서·보고서) 기준이 단계마다
# 다르다. 어느 단계 문서인지 가려야 `applies_to` 가 그 단계 기준만 걸 수 있다.
#
# **가리는 값은 한글 문서명이다** — AI시험인증1팀처럼 양식번호(SST-K-TP-…)가 없다.
# classify_output 은 form_no 가 파일명에 **들어 있는지**만 보므로 문서명이 그대로
# 열쇠가 된다. 실측(data/AX안전신뢰실/AX품질팀/문서 검토 샘플):
#
#     ACMD-AN-001_운영개념기술서_v2.0…      → ConOps
#     ACMD-AN-002_요구사항명세서_v2.0…      → SRS
#     ACMD-DS-005_상세설계서_(S2-1)…        → SDD
#     ACMD-DS-014_상세설계서_(S2-3)…        → SDD
#
# **IRS·IDD·검토의견서·보고서는 샘플이 없다.** 이름은 md 가 부르는 대로 적어 두되,
# 실제 파일명이 다르면 못 가린다 — 그때는 "산출물을 가리지 못했다"고 뜨고 단계별
# 기준은 사람 몫으로 떨어진다(조용히 통과시키지 않는다).
#
# 문서번호(AN/DS)로 가리지 않은 이유: AN-001 은 개념, AN-002 는 요구사항이라 앞
# 두 글자만으로는 안 갈린다. 번호까지 박으면 과제가 바뀔 때 못 쓴다.
outputs:
- key: ConOps
  form_no: 운영개념기술서
- key: SRS
  form_no: 요구사항명세서
- key: IRS
  form_no: 인터페이스요구사항
- key: SDD
  form_no: 상세설계서
- key: IDD
  form_no: 인터페이스설계서
- key: 검토의견서
  form_no: 검토의견서
- key: V&V보고서
  form_no: 검증보고서

# 검토 대상이 아닌 파일. 걸러내지 않으면 첨부물이 본체로 잡혀 엉뚱한 기준이 걸린다.
ignore:
- pattern: '_첨부_'
  reason: 산출물 본체가 아니라 첨부물입니다
- pattern: '업무프로세스'
  reason: 검토 대상 문서가 아닙니다
- pattern: '체크리스트'
  reason: 검토에 쓰는 잣대이지 검토 대상이 아닙니다
items:

# ══ 도구 기능 요구 (xlsx) ═══════════════════════════════════════════════
- 'no': '9'
  text: 미작성, 미확인 항목 도출
  group: 문서 양식·서식
  note: |-
    대상 문서를 입력하면 문서에 기재된 미정, 미확인, TBD(TBD), TBC(To be Confirmed) 항목을 엑셀 또는 워드 표로 정리해 주는 기능


    문서 업로드(요구사항 명세서 /설계 명세서 등) -> 문서내 TBD/TBC 항목 추적 -> 리스트화
  agent: 형식·완전성
  source: 문서검증 No.9
  mode: 규칙
  check: placeholder
  # 본문이 네 가지를 다 적었다. 기본값은 "TBD" 하나뿐이라(실문서 세 개에서 나머지가
  # 안 나왔다) 여기서 늘린다 — 이 팀은 미정·미확인·TBC 도 지적 대상이라고 적었다.
  params:
    placeholder_markers: ["미정", "미확인", "TBD", "TBC"]
- 'no': F2.1-1
  text: 파일명이 과제 문서번호 체계와 일치
  group: 문서 양식·서식
  note: |-
    §2.0 "문서번호 체계" 기준값(예: MPNT-AN-002)과 대조한다.
    기준값이 비면 판정하지 않는다 — 임의 판단은 근거가 없다(md §2.0 단서).
  agent: 형식·완전성
  mode: 규칙
  check: filename
  # params.filename_pattern 을 일부러 비웠다. §2.0 표가 비어 있어 형식을 모른다.
  # 지어 넣으면 멀쩡한 파일명이 전부 위반으로 뜬다. 지금은 검사기가
  # "파일명 규칙이 검토 기준에 없어 검사하지 않았습니다"로 밝힌다.
  source: VV_단일문서 §2.1
- 'no': F2.1-2
  text: 머릿말·꼬리말의 문서번호·버전이 파일명과 일치
  group: 문서 양식·서식
  agent: 형식·완전성
  mode: 사람
  # 머리말/꼬리말을 파일명과 맞대는 규칙 검사기가 아직 없다. check 를 비워 둔다.
  source: VV_단일문서 §2.1
- 'no': F2.1-3
  text: 표지에 제정일자·개정일자 기재 (개정 시 이력 표와 함께 갱신)
  group: 문서 양식·서식
  agent: 형식·완전성
  mode: 사람
