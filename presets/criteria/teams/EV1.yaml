name: 에너지검증 1팀
team: EV1
source_filename: DocSuree_요구사항_정리.xlsx
items:
- 'no': '3'
  group: 신호 데이터 추출
  text: 일관성 분석 데이터 추출
  note: |-
    1. PDF 문서 내 각 절 본문 내에 기술된 신호값 추출(Feature: 절, 절 내 형상(없으면 N/A), 본문 내용, 신호명, 입출력 구분, 판단근거)
    2. PDF 문서 내 표에 기재된 인터페이스/신호 정보 추출(Feature: 절, 상위 형상, 표 번호, 구분(인터페이스, 신호), {표에 기재된 Feature})
    3. PDF 문서 내 그림에 기재된 신호 정보 추출(Feature: 절, 상위형상, 그림번호, 구분(입출력 신호, 인터페이스, Flow chart, State Diagram 등), 신호명, 입출력데이터 구분, 판단근거)
  # **검사가 아니라 생성이다.** 본문이 "신호값 추출", "정보 추출" 을 말한다 —
  # 문서를 재는 것이 아니라 표를 만들어내는 작업이다. 형식·완전성 라벨을 달면
  # 규칙으로 잡혀 "검사하는 규칙이 없습니다" 로 뜨는데, 만들 규칙이 아니다.
  agent: 문서작성·생성
  source: EIS문서검증 No.3
- 'no': '8'
  group: 추적성·일관성
  text: 추적성 분석표 갱신
  note: |-
    요건 추가/변경/삭제 시 변경사항을 파악하고 추적성 분석표를 갱신

    1. SW 요구사항 명세서 (또는 설계 명세서)에서 변경사항을 식별
    2. 기존에 작성된 RTM을 기반으로 변경된 요구사항에 대해 재 분석
        1) 변경된 요구사항이 소프트웨어 요구사항이 아닌 경우, SW 요건을 False로 변경.
        2) 변경된 요구사항이 소프트웨어 요구사항인 경우, 변경 내용을 RTM에 반영
    3. 변경 내용에 따라 RTM의 Feature(=각 행) 수정
        1) 변경 사항이 문장 전체 구조에 영향이 미비한 경우 Feature ID 수정
        2) 변경 사항이 문장 전체, 또는 문서 전반에 영향을 줄 수 있는 경우 Feature ID를 삭제 후 추가 부여하는 등의 작업이 수행될 수 있음 (Optional)
    4. 수정/추가된 Feature에 대해 상위/하위 문서에서의 Feature와 정방향/역방향 추적성 분석 수행
  agent: 정합성·추적성
  source: EIS문서검증 No.8
- 'no': '9'
  group: 추적성·일관성
  text: 추적성 분석 유지 관리
  note: |-
    0-1. 분석이 진행되는 각 문서들의 DB가 이미 구성되었음을 전제. (형상번호-절-내용-SW Req.- 비고 등)
    0-2. 인접한 두문서간의 매핑 DB도 이미 구성됨을 전제. (SRS과 SDD간의 추적이라면, SRS 형상-SDD 형상-비고 등)
    1. 0-1을 Rev. 단위로 저장할수있도록 관리
    2. 0-2를 개정이 이뤄지면 다시 매핑할수 있도록 관리
    3. 0-1, 0-2를 토대로 추적이 필요한 문서들을 복수로 선택하여 정방향-역방향 추적성 분석표를 생성는 기능 구현
       (예: 4개 문서를 순차적으로 선택하면, DS-SRS-SDD-Sourcecode 형태의 정/역방향 추적성을 엑셀로 생성)
  agent: 정합성·추적성
  source: EIS문서검증 No.9
- 'no': '10'
  group: 작성 지원
  text: TC 설계
  note: |-
    SW 요구사항 명세서 (또는 설계 명세서)에서 각 요구사항 별로 Test Case 설계

    1. 문서의 각 요구사항에 대해 입력, 출력, 프로세스를 확인
    2. 입력과 출력 인터페이스를 TC 표에 작성
    3. 요구사항에 대한 TC 시나리오 설계
    4. 설계된 시나리오 대로 입력값과 출력 기대값 기술 (경계값 분석 활용)
    5. 설계된 TC가 모든 요구사항을 시험 할 수 있도록 작성되었는지 정합성 확인
  agent: 문서작성·생성
  source: EIS문서검증 No.10
- 'no': '11'
  group: 문서 품질
  text: 설계 산출물 및 V&V 산출물 품질검토
  note: |-
    설계 산출물 및 V&V 산출물에 대해 오탈자나 문맥상 오류인 부분들 점검

    1. 산출물에 대해 오탈자 검토
    2. 문서 번호 및 참조문서 이상 확인
    3. 참조 오류, 수식 및 서식 오류 점검
    4. 문서 내 용어 일관성 및 약어 점검
  # **공통 C1(오탈자)·C4(용어 일관성)와 겹치지만 더 넓다.** 이 항목은 오탈자에
  # 더해 "문서 번호 및 참조문서 이상", "수식 및 서식 오류" 까지 묶어 말한다.
  # 공통으로 대체하면 그 셋이 사라지므로 남긴다. 쪼개는 것이 맞지만, 참조문서·
  # 수식·서식을 볼 검사기가 아직 없어 지금 쪼개면 전부 사람 몫이 된다.
  agent: 표현·내용품질
  source: EIS문서검증 No.11
- 'no': '12'
  group: 발행 전 점검
  text: 산출물 발행
  note: |-
    V&V 산출물에 대해 발행본으로 생성

    1. Word의 경우 PDF로 생성 (개정본인 경우 개정바도 포함)
    2. Excel의 경우 글자 잘리지 않게 행 높이 조절하고, 인쇄영역 지정한다음 PDF로 생성
  agent: 형식·완전성
  source: EIS문서검증 No.12
  # 공통이 켜 주던 것을 여기서 켠다(EV2 40번 주석 참고).
  #
  # **이 자리는 어색하다.** 이 항목은 "Word 를 PDF 로 발행"인데 필수 장절 지적이
  # 여기 달린다. 아래 주석대로 이 팀 기준에 장절 항목이 없어 값을 여기 세워둔
  # 탓이다. EV1 의 xlsx 요구 6건(EIS No.3·8·9·10·11·12)에는 필수 장절이 실제로
  # 없다 — 값 자체가 EV2 에서 빌려온 것이라, 팀에 확인해 아니면 지우는 게 맞다.
  mode: 규칙
  check: required_sections
  # (이 팀 기준에는 장절을 다루는 항목이 따로 없어 발행 항목이 값을 든다.)
  # 필수 장절 목록. **검사는 공통 10번**(check: required_sections)이 켜고, 값은
  # 기준이 준다 — 엔진에 장절 이름을 박지 않는다. 같은 실(에너지인프라시스템실)
  # 3팀이 같은 문서 표준을 쓰므로 EV2 40번과 같은 값을 둔다(근거도 그 항목의
  # note: "시험검증팀의 모든 문서는 1.0 Purpose, 2.0 Scope, 3.0 References,
  # 4.0 Definitions and Abbreviations 으로 구성된다"). 값이 없으면 그 검사가
  # 모든 검토에서 "필수 절 목록이 검토 기준에 없어 …" 로 뜬다.
  # 표기는 EV2 와 글자까지 같아야 한다 — 검사기가 제목을 글자로 대조한다.
  params:
    required_sections:
      - "1.0 Purpose"
      - "2.0 Scope"
      - "3.0 References"
      - "4.0 Definitions and Abbreviations"
