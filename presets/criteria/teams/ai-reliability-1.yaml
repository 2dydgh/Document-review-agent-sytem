items:
- 'no': '1'
  group: 식별자
  text: 식별자 규칙
  note: |-
    요구사항 식별자&설계 식별자 번호 부여 규칙을 기반으로, 문서 내 식별자 번호 오류 등 검사

    식별자 규칙 확인 -> 문서 내 식별자 번호 확인 -> 규칙과 비교 -> 일치/불일치 여부 확인 -> 엑셀 정리
  agent: 형식·완전성
  source: 문서검증 No.1
- 'no': '2'
  group: 개정 이력
  text: 개정 이력
  note: |-
    상세 설계 항목별 작성 이력 기반, 문서 개정이력 날짜 검토

    개정 리스트 확인 -> 마지막 개정 이력 확인 -> 본문 전체에서 개정 이력 확인 -> 본문 전체에서 확인된 마지막 개정 날짜와 처음 확인한 개정 날짜 비교 -> 일치/불일치 여부 확인 -> 엑셀 정리
  agent: 형식·완전성
  source: 문서검증 No.2
- 'no': '4'
  group: 작성 지원
  text: 상세 설계
  note: |-
    소스코드 기반 상세 설계 내용 검토
    컴포넌트, 내외부 인터페이스 설계내용과 소스코드 일치 여부
    (입력, 출력, 흐름, 예외처리)

    입출력: 상세설계의 입출력 설명 확인 -> 소스코드의 입/출력 인자 확인 -> 설계내용과 소스코드 일치/불일치 여부 확인 -> 불일치 항목 정리

    기능: 상세설계의 흐름도 및 설명 확인 -> 소스코드의 변수명 확인 -> 소스코드의 조건분기 확인 -> 소스코드의 종료시점 확인 -> 설계내용과 소스코드 일치/불일치 여부 확인 -> 불일치 항목 정리

    예외처리: 상세설계의 예외처리 설명 확인 -> 소스코드의 조건분기 확인 -> 예외에 해당하는 분기 식별 -> 설계내용과 분기 내 소스코드 일치/불일치 여부 확인 -> 불일치 항목 정리
  agent: 정합성·추적성
  source: 문서검증 No.4
