items:
- 'no': '25'
  group: 작성 지원
  text: 체크리스트 기반 문서 검토
  note: |-
    체크리스트(평가 기준)과 평가 문서(고객 문서)를 주면 체크리스트에 해당하는 내용이 문서 어디에 있는지 정리
    - 평가 문서는 1개 이상

    고객 문서명 및 고객 설명을 대상으로 문서 분류(ex. 위험관리인지, 영향평가 인지) -> 문서 N개를 대상으로 체크리스트와 비교하여 체크리스트에 부합하는 내용이 있는지 확인 -> 확인된 절차에 대해 이행 기록이 있는지 확인 -> 체크리스트 항목 - 확인한 문서 명 및 내용 - 확인한 이행 내역 기재
  agent: 표준·체크리스트
  source: 문서검증 No.25
- 'no': '26'
  group: 작성 지원
  text: 검토 결과 의견 도출
  note: |-
    체크리스트 기반 문서 검토 수행 후, 누락사항/보완사항 등을 도출해주는 기능

    확인 내역을 기반으로 누락/보완사항 도출(평가자 의견) -> 점수 산정(0/1/2)
  agent: 표준·체크리스트
  source: 문서검증 No.26
- 'no': '27'
  group: 검토 이력
  text: 결과보고서 초안 작성
  note: |-
    2명 이상의 평가자가 각 체크리스트별로 평가한 내용을 취합하여 1개의 결과 보고서 생성

    2명 이상의 평가 자 의견을 체크리스트 항목별로 각각 취합 -> 단순 취합이 아닌 의견 조율 필요 -> 정해진 양식에 결과 작성
  agent: 검토의견·이력
  source: 문서검증 No.27
