case_wide:
# 작성일자 선후 관계 (문서 간 md §4): 의뢰서 → 계획서 → 설계서 → 시험 수행.
# 다른 항목과 달리 "다 같은가"가 아니라 **순서**가 값이다.
#
# 의뢰서는 빠져 있다. 결재란 구조가 달라 작성일자를 못 뽑는다 — 실측에서 접수일과
# 성적서 발급 예정일만 나왔다. 고객이 쓰는 문서라 결재란이 없을 수 있다(팀 확인 대기,
# docs/open-questions.md). 못 뽑는 것을 넣어두면 매번 "미검토"가 떠 소음이 된다.
- id: W-작성일자-순서
  field: 작성일자
  rule: nondecreasing
  outputs: [시험계획서, 시험설계서]
# md 는 "의뢰번호 전 문서 일치"라고 했지만 실측으로 셋은 담고 있지 않다:
#   시험의뢰 검토기록서  접수번호만 있고 의뢰번호가 없다
#   제출물 확인증        머릿말에만 있다 (서식 레이어가 없어 못 읽는다)
#   갑지                성적서번호만 있다
# outputs: all 로 두면 영원히 미검토라 검사가 늘 빨갛다. 담고 있는 것만 대조하고
# 셋은 팀 확인 사항으로 남긴다(docs/open-questions.md).
- id: W-의뢰번호
  field: 의뢰번호
  rule: exact
  outputs:
  - 시험의뢰서
  - 시험동의서
  - 시험계획서
  - 시험설계서
  - 현장시험환경 체크리스트
  - 시험기록서
  - 을지
- id: W-성적서번호
  field: 성적서번호
  rule: exact
  outputs:
  - 을지
  - 시험기록서
  - 갑지
- id: W-제품명
  field: 제품명
  rule: exact
  ignoring: version
  outputs:
  - 시험의뢰서
  - 시험계획서
  - 시험설계서
  - 을지
  - 시험기록서
  - 갑지
- id: W-시험합격기준
  field: 시험합격기준
  rule: exact
  outputs:
  - 시험의뢰서
  - 시험설계서
  - 을지
  - 갑지
- id: W-시험항목명
  field: 시험항목명
  rule: exact
  outputs:
  - 시험의뢰서
  - 시험설계서
  - 을지
  - 갑지
- id: W-시험환경_온도
  field: 시험환경_온도
  rule: exact
  outputs:
  - 시험계획서
  - 시험설계서
  - 을지
  - 시험기록서
  - 갑지
- id: W-시험환경_습도
  field: 시험환경_습도
  rule: exact
  outputs:
  - 시험계획서
  - 시험설계서
  - 을지
  - 시험기록서
  - 갑지
# 아래 넷은 md 가 §1 쌍으로 적었지만 3곳 이상에 걸친 값이라 여기로 접었다.
# 쌍으로 두면 같은 결함이 쌍 수만큼 지적된다 — 시험기간은 3곳이라 3번, 의뢰기관명은
# 4곳이라 6번(쌍 조합) 난다. md §3 이 "2개 문서만으로는 부분 판정"이라 한 그대로다.
- id: W-접수번호
  field: 접수번호
  rule: exact
  outputs:
  - 시험의뢰서
  - 시험의뢰 검토기록서
  - 현장시험환경 체크리스트
  - 시험기록서
- id: W-의뢰기관명
  field: 의뢰기관명
  rule: exact
  outputs:
  - 시험의뢰서
  - 시험의뢰 검토기록서
  - 을지
  - 갑지
- id: W-버전
  field: 버전
  rule: exact
  outputs:
  - 시험계획서
  - 시험설계서
  - 을지
- id: W-시험기간
  field: 시험기간
  rule: exact
  outputs:
  - 시험계획서
  - 을지
  - 갑지
- id: W-시험일자
  field: 시험일자
  rule: exact
  outputs:
  - 시험계획서
  - 현장시험환경 체크리스트
  - 시험기록서
# md §1 은 문서쌍 18개 · 87항목을 적었다. 그중 여기 남는 것은 **정확히 2곳에만
# 있는 값**뿐이다. 3곳 이상은 위 case_wide 로 접었고(지적 1건 · 근거 N개),
# 표 전체를 훑어야 하는 항목(시험절차·부록·장비 목록·수식)은 추출 어휘가 없어
# 아직 못 한다. 쌍별 내역은 docs/open-questions.md 의 표를 본다.
pairs:
- id: 1-7
  left: 시험의뢰서
  right: 갑지
  priority: high
  rows:
  - field: 대표자
  - field: 의뢰기관주소
  - field: 성적서용도
- id: 1-12
  left: 시험기록서
  right: 갑지
  rows:
  - field: 시험방법
- id: 1-16
  left: 시험의뢰서
  right: 시험의뢰 검토기록서
  rows:
  - field: 접수일
manual:
- id: M-접수번호
  text: 접수번호가 올바른 값인가
  against: 시스템 부여값
- id: M-접수일
  text: 접수일이 works 등록 일자와 같은가
  against: works
- id: M-의뢰기관명
  text: 의뢰기관명이 사업자등록증 표기와 같은가 (띄어쓰기 포함)
  against: 사업자등록증
items:
- 'no': 칸값-1
  group: 산출물별 필수 칸
  text: 문서 양식 검토
  note: |-
    시험 산출물에 따라 작성해야 하는 항목들이 비어 있지 않고, 작성되어 있는지 검토
    - 필수 항목 누락 여부, 표 가운데 정렬, 머릿말 작성 여부, 최신 문서 양식 적용 여부 등

    산출물별 필수 작성 필드(리스트) 확인 → 본문 전체의 해당 필드를 확인하여, 작성 여부 확인 → 식별된 누락 내역, 양식 미적용 내역 정리
  agent: 형식·완전성
  source: 문서검증 No.12
  mode: 규칙
  check: field_presence
  # params.fields 를 안 적었다 = 그 산출물의 칸을 **전부** 본다. 이 팀은 산출물이
  # 여럿이고 산출물마다 칸이 달라서(위 outputs 절), 기준이 이름을 미리 못 적는다.
  # 어느 산출물인지는 파일명으로 가린다 — 못 가리면 검사를 걸지 않고 그 사실을 남긴다.
  #
  # 본문의 "표 가운데 정렬·머릿말·최신 양식"은 아직 못 한다. 이 항목의 결과는
  # "필수 항목 누락 여부"에 대한 것뿐이다.
- 'no': 서식-1
  group: 서식
  text: 글꼴 맑은 고딕 9 pt, 색 검정(서명 칸 제외), 스타일 보통
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-2
  group: 서식
  text: 머릿말에 의뢰번호·성적서번호 기재
  agent: 형식·완전성
  # **md 는 이것을 §1.2(전 문서 공통)에 뒀지만 실문서는 제각각이다.** 실측(산출물
  # 11종): 의뢰번호는 8종에서 읽히고 현장체크리스트·기록서·갑지에는 없다.
  # 성적서번호는 을지에만 있다. 그래서 이 기준은 여러 문서에서 MAJOR 를 낸다.
  #
  # 기준을 md 대로 둔 것은 **팀이 그렇게 적었기 때문**이다. 팀이 "갑지는 머릿말이
  # 없는 게 맞다" 고 하면 그때 applies_to 로 대상을 좁힌다 — 우리가 임의로 좁히면
  # 팀 규정과 다른 잣대로 재게 된다.
  mode: 규칙
  check: header_footer
  source: 단일문서 §1.2
  params:
    where: header
    contains: [의뢰번호, 성적서번호]
    _no: 서식-2
- 'no': 서식-3
  group: 서식
  text: 꼬리말에 페이지·양식 번호 기재
  agent: 형식·완전성
  mode: 규칙
  check: header_footer
  source: 단일문서 §1.2
  params:
    where: footer
    pattern: '페이지\s*\(\s*\d+\s*\)'
    message: '꼬리말에 `페이지 ( X ) / 총 ( Y )` 표기가 없습니다'
    _no: 서식-3
- 'no': 서식-4
  group: 서식
  text: 표 가운데 정렬 — 표 맞춤 가운데 / 텍스트 배치 없음 / 셀 세로 맞춤 가운데
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-5
  group: 서식
  text: 표의 행 번호가 순서대로(1, 2, 3 …)
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-6
  group: 서식
  text: '`-이하 여백-`·`-끝-`이 지정 형식 그대로 (서명이 문서 마지막이면 `-끝-` 제외)'
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-7
  group: 서식
  text: 단락 설정 — 한글 단어 잘림 허용 해제, 한글↔영어·한글↔숫자 간격 자동 조절 해제
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-8
  group: 서식
  text: 줄바꿈 지점에서 단어가 잘리지 않음
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.2
- 'no': 서식-9
  group: 서식
  text: '페이지 `( X ) / 총 ( Y )` — 숫자 양옆 공백 1개, 총 페이지 = 실제 페이지 수'
  agent: 형식·완전성
  # **두 요구 중 앞쪽만 검사한다.** 표기 형식은 꼬리말을 보면 판정되지만,
  # "총 페이지 = 실제 페이지 수" 는 문서의 진짜 쪽수를 알아야 한다. 파서가 센
  # 쪽수(meta["pages"])는 변환을 거친 값이라 원본과 다를 수 있어(실측: 을지
  # 꼬리말은 총 12 인데 파서는 8) 그걸로 지적을 내면 안 된다 — 지금은 문서
  # 서식만 본다. 쪽수 대조는 파서가 원본 쪽수를 확정해 줄 때 붙인다.
  mode: 규칙
  check: header_footer
  source: 단일문서 §1.2
  params:
    where: footer
    # 서식-3 은 같은 자리를 **느슨하게** 본다(`페이지\s*\(\s*\d+\s*\)`) — 그건
    # "있는가"를 묻는 기준이다. 여기는 "형식이 맞는가"라 공백을 딱 하나로 못박는다.
    # 둘이 갈려 있어야 표기가 틀린 문서에서 서식-3 은 통과하고 서식-9 만 걸린다.
    pattern: '페이지 \( \d+ \) / 총 \( \d+ \)'
    message: '꼬리말 쪽수 표기가 `페이지 ( X ) / 총 ( Y )` 형식과 다릅니다 (숫자 양옆 공백 1개)'
    _no: 서식-9
- 'no': 표기-1
  group: 표기
  text: '빈 셀에 모두 `-` 입력 (공란 금지, `N/A` 대신 `-`)'
  agent: 형식·완전성
  mode: 사람
  source: 단일문서 §1.3
- 'no': 표기-2
  group: 표기
  text: '날짜 `YYYY. MM. DD.` (마침표 3개·공백 포함), 기간은 `~` 양옆 공백 없음'
  agent: 형식·완전성
  mode: 규칙
  check: text_pattern
  source: 단일문서 §1.3
  params:
    find: '\d{4}\s*[.\-/]\s*\d{1,2}\s*[.\-/]\s*\d{1,2}\.?'
    must: '\d{4}\. \d{2}\. \d{2}\.'
    message: '날짜는 `YYYY. MM. DD.` 형식으로 씁니다 (마침표 3개·공백 포함)'
    _no: 표기-2

- 'no': 표기-3
  group: 표기
  text: '숫자와 단위 사이 공백 — `19.0 °C`, `10 배`, `1000 LOC`'
  agent: 형식·완전성
  # 한때 사람이었다 — "공통 기준의 오탈자 검사가 이미 본다"고 적어 뒀는데, 그건
  # LLM 한테 맡긴다는 뜻이었다. 글자 모양만 보면 판정되는 것을 LLM 에 맡길 이유가
  # 없다(text_pattern 머리말). 규칙이 싸고 확실하다.
  mode: 규칙
  check: text_pattern
  source: 단일문서 §1.3
  params:
    # **붙어 있는 것만** 잡는다. `\d\s*단위` 로 쓰면 맞게 쓴 `26.6 °C` 까지 걸린다
    # (표기-4 가 같은 실수를 한 번 했다).
    #
    # 단위 목록은 두 곳에서 왔다. md 가 든 것(`°C` `배` `LOC`)과, **팀 문서가
    # 실제로 쓰는 것**이다 — 시험 산출물 11종에서 숫자 뒤에 공백 하나 두고 오는
    # 낱말을 세어 골랐다: 회 30 · GB 18 · s 14 · GHz 11 · 건 7 · °C 7 · 개 6.
