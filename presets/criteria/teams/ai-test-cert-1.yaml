# AI시험인증1팀 검토 기준
#
# ── 어디서 왔나 ──────────────────────────────────────────────────────
# **팀이 정리해 준 md 2건** (data/AX안전신뢰실/AI시험인증팀/):
#   _요구사항_단일문서.md   문서 하나만 보고 판정 — 체크 93줄
#   _요구사항_문서 간.md    문서 2개를 대조 — 18쌍 · 87항목
#
# 기준의 출처가 **문서 밖**이다. 문서를 열어보고 거꾸로 뽑은 값이 아니라 팀이
# 관리하는 규정에서 온다. 그래서 문서와 규정이 어긋나면 지적이 나온다 — 옛
# presets/checklists/acmd.yaml 이 문서에서 뽑은 정규식으로 그 문서를 재서 순환에
# 빠진 것과 반대다(presets/README.md).
#
# 요구사항 xlsx 에서 오던 13건은 정리했다(2026-08-20). 그 시트는 팀이 **도구에
# 요구한 기능** 이라 문서를 재는 잣대가 아닌 것이 섞여 있었다(생성 계열 6건 등).
# 남긴 것은 실제로 도는 하나뿐이다 — `칸값-1`(source: 문서검증 No.12).
# 오탈자(No.15)·단어 통일(No.23)은 **공통 C1·C4** 로 올라갔다.
#
# 범위는 `variant: 일반` 이다. 공인(KOLAS)·영문은 양식번호와 문구가 달라 별도 파일이 든다.
#
# ── 번호와 묶음 ──────────────────────────────────────────────────────
# 번호는 **화면에 그대로 보이는 값**이라 읽히게 짓는다. 앞머리가 곧 묶음이다:
#
#   서식 · 표기 · 맞춤법·문장 · 시험 환경 기재     md §1 (전 문서 공통)
#   검토기록서 · 의뢰서 · 계획서 · 현장 · 설계서
#   기록서 · 을지 · 갑지                          md §2 (산출물별)
#
# md 의 절 번호(§2 의 1-1, 3-2, 4-3 …)를 그대로 쓰지 않았다. md 안에서도 3-2 가
# 3-1 앞에, 4-3 이 4-2 앞에 있어 화면이 뒤죽박죽으로 보인다. 되짚을 근거는
# 항목마다 `source` 에 남겼다.
#
# ── 어느 절이 무슨 일을 하나 ────────────────────────────────────────
#   items                          문서 1건 검토 (orchestrator.py)
#   outputs·inputs·ignore
#   page_count_source·case_wide
#   pairs·manual                   산출물 폴더 검토 (case.py)
#
# **한 검토에서 둘 다 돈다.** 그래서 items 에 outputs 가 이미 보는 것을 또 적으면
# 같은 결함이 두 번 지적된다.
#
# ── 산출물을 가려서 건다 ────────────────────────────────────────────
# 산출물별 항목은 `applies_to` 로 대상 문서를 못박는다. 없으면 "갑지의 비고문구"
# 같은 기준이 시험의뢰서 검토에도 떴다 — 실측: 시험의뢰서 검토에서 21건이 빠진다.
#
# ── 아직 사람 몫인 것이 많다 ────────────────────────────────────────
# 48건 중 41건이 `사람` 이다. 검사기가 없어서지 사람이 봐야 해서가 아닌 것이
# 섞여 있다 — 날짜·단위·기호 표기처럼 정규식 하나면 되는 것이 9건이다
# (표기-2·4·5·6·8·9 · 환경-3·4 · 기록서-1). 그 검사기를 만들면 한꺼번에 넘어간다.
# 글꼴·정렬·머리말·페이지 수는 파서가 그 정보를 안 실어 지금은 손댈 수 없다.
#
# 라벨(labels)은 후보 목록이다. 같은 필드의 라벨이 문서마다 다르다(실측):
#     시험의뢰서·동의서 "의뢰번호 :"      제출물 확인증 "의뢰 번호:"
# 공백을 무시해 맞추되 **셀 전체가 같아야** 한다. 부분일치는 위험하다 — 갑지에는
# `주소 :`(슈어 주소)와 `주소`(의뢰기관 주소)가 둘 다 있어 엉뚱한 값을 잡는다.
#
#     at: right   라벨 셀의 오른쪽 칸이 값 (갑지처럼 세로 표)
#     at: below   라벨 셀의 아래 칸이 값 (을지 머리표처럼 가로 표)
#
# signatures 는 서명이 들어갈 자리다. placeholder 가 그대로 남아 있으면 미작성이다 —
# 실측: 샘플 갑지가 `성명                          (서명)` 그대로였다.

# ── 공통으로 올라간 항목 (2026-08-20) ────────────────────────────────
#   No.15 문서 내용 검토(띄어쓰기·문법·오탈자) → 공통 C1
#   No.23 문서 단어 통일성 검토(정확도/정확성)  → 공통 C4
#
# **공통 C1·C4 의 근거가 바로 이 두 항목의 본문**이다 — 두 실이 같은 것을
# 요구했다는 증거로 인용했다. 남겨두면 같은 지적이 기준 둘에 붙는다.
# 원문은 요구사항 xlsx "문서 검증 요구사항" 시트 No.15·23 에 있다.
name: AI시험인증1팀
team: AI시험인증1팀
source_filename: DocSuree_요구사항_정리.xlsx
variant: 일반
outputs:
- key: 시험의뢰 검토기록서
  form_no: SST-K-TP-7-01-01(02)
  folder: 00.시험의뢰서 및 제출물 확인증
  # 실측: 의뢰번호가 이 문서에 없다(접수번호만). W-의뢰번호에서 뺀 이유다.
  fields:
  - name: 접수번호
    from: table
    labels:
    - 접수번호
    at: right
    pattern: RN-\d{2}-\d{3}
    required: true
  - name: 접수일
    from: table
    labels:
    - 접수일
    at: right
    format: date
    required: true
  - name: 의뢰기관명
    from: table
    labels:
    - 의뢰기관 명
    at: right
    required: true
  signatures:
  - role: 시험실무자
    placeholder: 성명
- key: 시험의뢰서
  form_no: SST-K-TP-7-01-02(08)
  folder: 00.시험의뢰서 및 제출물 확인증
  fields:
  - name: 접수번호
    from: table
    labels:
    - 접수번호
    at: right
    pattern: RN-\d{2}-\d{3}
    required: true
  - name: 접수일
    from: table
    labels:
    - 접수일
    at: right
    format: date
    required: true
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰번호
    at: right
    pattern: SST-\d{2}-\d{3}
    required: true
  - name: 의뢰기관명
    from: table
    labels:
    - 기관명
    at: right
    required: true
  - name: 대표자
    from: table
    labels:
    - 대표자
    at: right
    required: true
  - name: 의뢰기관주소
    from: table
    labels:
    - 주소
    at: right
    required: true
  - name: 제품명
    from: table
    labels:
    - 제품명
    at: right
    required: true
  - name: 성적서용도
    from: table
    labels:
    - 성적서 용도
    at: right
    required: true
- key: 시험동의서
  form_no: SST-K-TP-7-01-07(00)
  folder: 00.시험의뢰서 및 제출물 확인증
  fields:
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰번호
    at: right
    pattern: SST-\d{2}-\d{3}
    required: true
- key: 제출물 확인증
  form_no: SST-K-TP-7-04-01(02)
  folder: 00.시험의뢰서 및 제출물 확인증
  # 실측: 의뢰번호가 표에 없고 머릿말에만 있다. 서식 레이어가 없어 못 읽는다 —
  # 그래서 W-의뢰번호에서 뺐다.
  #
  # 제출물 목록은 칸 하나가 아니라 표 전체다(from: table_rows). 실측: 실제 제출물은
  # 1건인데 빈 행이 20줄 더 있고 표 끝에 `| 비고 |  |` 가 붙는다 — 앞은 key(제출물명)가
  # 비어서, 뒤는 열 수가 모자라서 걸러진다.
  fields:
  - name: 제출물목록
    from: table_rows
    columns: [제출물명, 제출물 형태, 부수, 구분, 반환/폐기 날짜, 확인]
    required_columns: [제출물명, 제출물 형태, 부수, 구분]
    required: true
- key: 시험계획서
  form_no: SST-K-TI-03-01(05)
  folder: 01.시험계획서
  # 실측: 머리표가 가로다 — | 의뢰번호 | 시험 실무자 | 기술 책임자 | 아래가 값.
  fields:
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰번호
    at: below
    pattern: SST-\d{2}-\d{3}
    required: true
  - name: 제품명
    from: table
    labels:
    - 시험 대상 품명
    at: right
    required: true
  - name: 버전
    from: table
    labels:
    - 버전
    at: right
    required: true
  - name: 시험기간
    from: table
    labels:
    - 시험 수행 기간
    at: right
    format: date_range
    required: true
  # 작성일자 — 결재란에 라벨 없이 열 위치로만 있다. 실측(계획서 2026. 01. 02. ·
  # 설계서 2026. 01. 03.):
  #     | 의뢰번호    | 시험 실무자        | 기술 책임자       |
  #     | SST-26-999 |  | 2026. 01. 02. |  | 2026. 01. 02. |
  # 머리행 3칸 · 값 행 5칸이라 칸 번호로는 못 맞춘다. 빈 칸을 걷어내면 1:1 이다.
  - name: 작성일자
    from: table_cell
    columns: [의뢰번호, 시험 실무자, 기술 책임자]
    key: 시험 실무자
  # 문서 간 요구사항 §3은 계획서·설계서·을지·기록서·갑지 5곳의 온도·습도
  # 일치를 요구한다. 현재 샘플 계획서에는 숫자가 없지만, 필드맵까지 빼면
  # "문서에서 못 찾음"이 아니라 "검사 설정 없음"이 되므로 기대 칸을 명시한다.
  - name: 시험환경_온도
    from: table
    labels:
    - 온도
    at: right
    required: true
  - name: 시험환경_습도
    from: table
    labels:
    - 습도
    at: right
    required: true
- key: 시험설계서
  form_no: SST-K-TI-03-02(05)
  # 문서 간 md: "테스트케이스 글꼴 크기가 8 pt 또는 9 pt". 표 안에 **직접 박힌**
  # 크기만 본다 — 실측에서 그게 곧 테스트케이스였다(8pt 139자). 본문은 스타일이
  # 정하고 그 크기는 아직 못 읽는다.
  font_sizes: [8, 9]
  folder: 02.시험설계서
  fields:
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰번호
    at: below
    pattern: SST-\d{2}-\d{3}
    required: true
  - name: 제품명
    from: table
    labels:
    - 시험 대상 품명
    at: right
    required: true
  - name: 버전
    from: table
    labels:
    - 버전
    at: right
  # 작성일자 — 결재란에 라벨 없이 열 위치로만 있다. 실측(계획서 2026. 01. 02. ·
  # 설계서 2026. 01. 03.):
  #     | 의뢰번호    | 시험 실무자        | 기술 책임자       |
  #     | SST-26-999 |  | 2026. 01. 02. |  | 2026. 01. 02. |
  # 머리행 3칸 · 값 행 5칸이라 칸 번호로는 못 맞춘다. 빈 칸을 걷어내면 1:1 이다.
  - name: 작성일자
    from: table_cell
    columns: [의뢰번호, 시험 실무자, 기술 책임자]
    key: 시험 실무자
  - name: 시험환경_온도
    from: table
    labels:
    - 온도
    at: right
    required: true
  - name: 시험환경_습도
    from: table
    labels:
    - 습도
    at: right
    required: true
  # 시험합격기준은 넣지 않는다. 설계서는 구체 기준을 문장으로 적고
  # (`사과 인식률이 95 % 이상이어야 한다. · …`) 갑지는 `의뢰자 제시 기준 (시험 결과
  # 참조)` 로 적는다 — 표기 방식이 달라 exact 대조가 거짓 지적을 낸다(실측).
  # 규칙이 문서를 지적하면 문서가 아니라 규칙 해석을 의심한다. 팀 확인 대기.
- key: 현장시험환경 체크리스트
  form_no: SST-K-TI-04-01(03)
  folder: 02.시험설계서
  fields:
  - name: 접수번호
    from: table
    labels:
    - 접수 번호
    at: right
    pattern: RN-\d{2}-\d{3}
    required: true
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰 번호
    at: right
    pattern: SST-\d{2}-\d{3}
    required: true
  - name: 시험일자
    from: table
    labels:
    - 시험 일자
    at: right
    format: date
    required: true
- key: 시험기록서
  form_no: SST-K-TP-7-05-01(04)
  folder: 03.시험성적서 및 시험자료 기록
  fields:
  - name: 접수번호
    from: table
    labels:
    - 접수번호
    at: right
    pattern: RN-\d{2}-\d{3}
    required: true
  - name: 의뢰번호
    from: table
    labels:
    - 의뢰번호
    at: right
    pattern: SST-\d{2}-\d{3}
    required: true
  - name: 제품명
    from: table
    labels:
    - 시험 대상 품명 및 버전
    at: right
    required: true
  - name: 시험방법
    from: table
    labels:
    - 적용 시험 방법
    at: right
    required: true
  # 실측: 기록서는 "저장 일자"라 부른다. 체크리스트의 "시험 일자"와 같은 값인지는
  # 팀 확인 대기(docs/open-questions.md) — 샘플에서는 둘 다 2026. 01. 08. 이다.
  - name: 시험일자
    from: table
    labels:
    - 저장 일자
    at: right
    format: date
    required: true
  # 기록서는 온도와 습도가 `시험 환경` 오른쪽 한 칸에 함께 적힌다.
  - name: 시험환경_온도
    from: table
    labels:
    - 시험 환경
    at: right
    capture: '온도\s*:\s*(?P<value>\([^)]*\)\s*°C)'
    required: true
  - name: 시험환경_습도
    from: table
    labels:
    - 시험 환경
    at: right
    capture: '습도\s*:\s*(?P<value>\([^)]*\)\s*%\s*R\.H\.)'
    required: true
