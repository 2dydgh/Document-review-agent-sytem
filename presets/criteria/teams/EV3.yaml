name: 에너지검증 3팀
team: EV3
source_filename: DocSuree_요구사항_정리.xlsx
items:
- 'no': '1'
  group: 추적성·일관성
  text: 추적성 분석 (최초 수행)
  note: |-
    상위 문서 및 하위 문서의 SW 요구사항을 기반으로 문서간 Feature에 대해 추적성 분석 수행

    1. 상위 문서를 장절/문단/문장 등의 적절한 단위로 분리
    2. 분리된 내용에 대해 Feature ID 부여
    3. Feature의 내용이 SW 요건인지 확인
    4. 하위 문서를 장절/문단/문장 등의 적절한 단위로 분리
    5. 분리된 내용에 대해 Feature ID 부여
    6. Feature의 내용이 SW 요건인지 확인
    7. 상위 문서/하위 문서의 SW 요건을 기반으로 Feature간 내용 추적
    8. 엑셀 정리
  agent: 정합성·추적성
  source: EIS문서검증 No.1
- 'no': '2'
  group: 약어·용어
  text: 약어 추가/삭제
  note: |-
    문서 내에서 사용되는 약어를 정리(추가/삭제)하여 약어장절의 리스트에 최신화.

    삭제
    1. 약어 리스트의 약어를 전체 검색으로 검색하여 사용 여부 확인.
    2. 검색되는 부분 없을 시, 리스트에서 해당 약어 삭제
    추가
    1. 문서내에서 사용된 약어를 약어 리스트에서 존재 여부 확인.
    2. 존재 하지 않을 시, 해당 약어를 약어 리스트에 추가.
  # **공통 C2(약어 목록 대조)와 겹쳐 보이지만 다르다.** 이 항목은 "약어 리스트를
  # 추가/삭제하여 최신화" 하는 **생성 작업**이다 — 공통은 "목록과 본문이 맞는가"를
  # 보는 검사다. 다만 지금은 검사기가 그것(abbrev)뿐이라 같은 것을 켜고 있다.
  # 생성 계열 기능이 생기면 그쪽으로 옮긴다.
  agent: 형식·완전성
  source: EIS문서검증 No.2
  mode: 규칙
  check: abbrev
  # 본문이 양방향을 그대로 적었다 — 삭제(목록에 있는데 본문에 없음)와
  # 추가(본문에 있는데 목록에 없음). 검사기가 둘 다 낸다.
- 'no': '4'
  group: 추적성·일관성
  text: 내부 신호 일관성 분석
  note: |-
    문서내에서 사용되는 신호에 대해서 일관되게 동일한 신호명으로 사용했는지를 확인.
    1. 인터페이스 목록과 요건 입출력 신호간 신호 일관성 테이블 작성
      1) 인터페이스 목록의 신호가 본문내 기술된 요건에서 사용되었는지를 확인(사용된 장절, 요건 ID, 입력/출력 여부, 신호명)
    2. 요건 입출력 신호와 동작(Process) 신호간 신호 일관성 테이블 작성
      1) 요건 입/출력 신호가 동작(Process)에 모두 동일하게 사용되었는지를 확인
    3. 인터페이스 목록과 인터페이스 그림간 신호 일관성 테이블 작성
      1) 인터페이스 그림에서 사용된 신호명이 인터페이스 목록의 신호명과 동일하게 사용되었는지를 확인
  # **공통 C4(같은 개념 다른 용어)와 다르다.** 이것은 **신호명** 일관성이고,
  # 인터페이스 목록·요건·동작(Process)·그림 넷을 맞대는 표를 만든다. 문서 안의
  # 낱말이 갈렸는가가 아니라 **설계 요소 사이 연결**을 보는 것이다.
  agent: 형식·완전성
  source: EIS문서검증 No.4
- 'no': '5'
  group: 추적성·일관성
  text: 외부 신호 일관성 분석
  note: |-
    상위문서와 하위 문서간에 외부 입/출력 신호를 동일하게 사용하였는지 확인.
    1. 상위 문서의 외부 입/출력 신호를 가져와 테이블을 작성.
    2. 상위 문서의 외부 입/출력 신호와 매핑하여 하위 문서에서 사용된 외부 입/출력 신호명을 테이블에 작성.
    3. 동일하지 않은 신호명, 신호 누락, 신호 추가등의 여부를 확인.
  # **문서 2개가 있어야 판정된다.** 본문이 "상위문서와 하위 문서간에 외부 입/출력
  # 신호를 동일하게 사용하였는지" 를 묻는다. 단일 문서 검토에서는 대조 상대가
  # 없다 — 문서 간 검토(compare)의 몫이다. 규칙으로 두면 "검사하는 규칙이 없다"
  # 로 보여, 검사기를 만들면 될 것처럼 오해를 준다.
  agent: 정합성·추적성
  mode: 사람
  source: EIS문서검증 No.5
- 'no': '6'
  group: 문서 표준 준수
  text: 관련 표준 준수 여부
  note: |-
    요구사항 명세서(IEEE Std 830), 설계 명세서(IEEE Std 1016), 시험 문서(IEEE Std 829) 등과 같이
    해당 표준의 템플릿의 장절에 맞춰서 필수 내용을 구성하였는지 확인.
    요구사항 명세서 기준 시
    1. 범위에 대한 내용이 기술되어 있는지 확인.
    2. 기능들에 대한 내용이 기술되어 있는지 확인.
    3. 성능요구사항에 대한 내용이 기술되어 있는지 확인.
    .....
  agent: 표준·체크리스트
  source: EIS문서검증 No.6
  # 공통이 켜 주던 것을 여기서 켠다(EV2 40번 주석 참고).
  mode: 규칙
  check: required_sections
  # 필수 장절 목록. **검사는 공통 10번**(check: required_sections)이 켜고, 값은
  # 기준이 준다 — 엔진에 장절 이름을 박지 않는다. 같은 실(에너지인프라시스템실)
  # 3팀이 같은 문서 표준을 쓰므로 EV2 40번과 같은 값을 둔다(근거도 그 항목의
  # note: "시험검증팀의 모든 문서는 1.0 Purpose, 2.0 Scope, 3.0 References,
  # 4.0 Definitions and Abbreviations 으로 구성된다"). 값이 없으면 그 검사가
  # 모든 검토에서 "필수 절 목록이 검토 기준에 없어 …" 로 뜬다.
  # 표기는 EV2 와 글자까지 같아야 한다 — 검사기가 제목을 글자로 대조한다.
  params:
    required_sections:
      - "1.0 Purpose"
      - "2.0 Scope"
      - "3.0 References"
      - "4.0 Definitions and Abbreviations"
- 'no': '7'
  group: 서식
  text: 글꼴
  note: |-
    문서 전반에 걸쳐 한글은 `맑은 고딕`, 영어는 `Times new roman` 적용.

    1. 문서 전체에 걸쳐 `맑은 고딕` 적용
    2. 문서 전체에 걸쳐 `Times New Roman` 글꼴 적용
  agent: 문서작성·생성
  source: EIS문서검증 No.7
- 'no': '13'
  group: 파일명·표지
  text: "제출 문서 파일명 \n양식 확인"
  note: |-
    제출문서 파일명을 아래 양식으로 작성되었는가를 확인
    예) Z11008-940VD-011C_Rev.08_RVVR for ESF-CCS for SKN56
    계통문서번호_버전_문서명
  agent: 형식·완전성
  source: EIS문서검증 No.13
  mode: 규칙
  check: filename
  # 본문의 "계통문서번호_버전_문서명" 과 예시를 검사기가 쓸 수 있는 값으로 옮긴 것이다.
  # 세 도막을 `_` 로 나누고 가운데가 `Rev.NN` — 여기까지가 본문이 실제로 말한 것이다.
  #
  # 계통문서번호의 속 형식(`Z11008-940VD-011C`)은 **박지 않았다.** 본문은 "계통문서
  # 번호"라고만 하고 그 형식을 정의하지 않는다. 예시 하나에서 형식을 거꾸로 뽑아
  # 넣으면 다른 계통의 멀쩡한 문서가 전부 틀린 것으로 뜬다 — 옛 checklists 가 그렇게
  # 만들어졌다가 지워졌다(app/config.py apply_criteria_params 주석 참고).
  params:
    filename_pattern: '[^_]+_Rev\.\d+_.+'
    filename_example: Z11008-940VD-011C_Rev.08_RVVR for ESF-CCS for SKN56
- 'no': '14'
  group: 참조문서
  text: 참조 문서 목록 확인
  note: |-
    표준화된 참조 문서 목록으로 작성되었는가를 확인
    1. 참조문서 표시 형태가 SPM과 일치하는지 확인.
    2. 참조문서 목록 오름차순 정렬 확인.
    3. 참조문서 Rev. 표시는 필요한 대상에만 표시했는지 확인.
  agent: 형식·완전성
  mode: 규칙
  check: reflist
  # EV2 25번과 같은 요구다(참조문서 목록 ↔ 본문 인용 양방향). 그쪽은 붙어
  # 있는데 여기만 빠져 있었다 — 검사기가 없어서가 아니라 안 이어서였다.
  #
  # note 의 나머지 둘은 이 검사기가 못 한다: 표시 형태가 SPM 과 같은지,
  # 목록이 오름차순인지. 그 둘은 여전히 사람 몫이다.
  source: EIS문서검증 No.14
- 'no': '15'
  group: 개정
  text: 개정바 표시 확인
  note: |-
    개정본 문서에 개정바를 아래 기준으로 표시 되었는가를 확인
    1. 개정바는 정확히 내용이 변경된 위치에 표시
    2. 엔터나 띄어쓰기, 관사 변경 등 소소한 변경에 의한 개정바는 미적용
    3. 내용의 이동은 대표적(타이틀 등)에만 적용
  agent: 형식·완전성
  source: EIS문서검증 No.15
- 'no': '16'
  group: 본문-부록 연결
  text: Appendix 간지 확인
  note: |-
    문서 Appendix 별 간지가 아래와 같은 기준으로 작성되었는지 확인
    1. 첨부되는 서류인 경우 간지 추가
    2. 각 Appendix가 유사항 형태인 경우 구분이 필요할 때 간지 추가
  agent: 형식·완전성
  source: EIS문서검증 No.16
