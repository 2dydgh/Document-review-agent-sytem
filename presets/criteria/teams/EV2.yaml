# ─────────────────────────────────────────────────────────────────────────
# outputs — 산출물별 칸 값 검사 (agent_format.FieldPresenceChecker).
#
# **이 절은 코드를 건드리지 않고 얹은 것이다.** AI시험인증1팀용으로 만든 검사기가
# 다른 팀 기준에도 그대로 쓰이는지 재려고 넣었다(docs/checker-inventory.md 참조).
#
# 실측 대상: data/에너지검증팀/SKN56_CDMS_RVVR_Rev08.docx (RVVR 표지)
#
#     | 작 성 자 : |  | Date : |  |
#     | 검 토 자 : |  | Date : |  |
#     | 승 인 자 : |  | Date : |  |
#     | 발 행 일 : |  |  |  |  |
#
# 라벨에 자간이 들어가 있는데(`작 성 자`) 추출기가 공백을 무시해 맞춘다.
# 네 칸이 전부 비어 있다 — 항목 20(표지 정보 확인)이 잡아야 하는 것이다.
#
# 다루지 못한 것 (어휘가 모자란 자리):
#   · 문서번호·개정번호 — 표지 첫 행에 라벨 없이 한 칸에 뭉쳐 있다
#     (`J2005-SRS-01 (Doosan Doc No. : …) REVISION 08`). 라벨 기반으로 못 뽑는다.
#   · Date — 같은 라벨이 세 행에 반복된다. 추출기는 첫 번째만 집어서
#     "작성일자"인지 "승인일자"인지 가릴 수 없다.
#   · 개정기록 완전성(항목 21) — 표의 **모든 행**을 봐야 하는데 지금 어휘는
#     칸 하나만 집는다.
outputs:
- key: RVVR
  fields:
  - name: 작성자
    labels: ['작성자 :']
    required: true
  - name: 검토자
    labels: ['검토자 :']
    required: true
  - name: 승인자
    labels: ['승인자 :']
    required: true
  - name: 발행일
    labels: ['발행일 :']
    required: true
  # 항목 21 개정기록 완전성 — 표의 **모든 행**을 본다(from: table_rows).
  # 실측(SKN56_CDMS_RVVR_Rev08.docx): 9행이고 열 사이에 빈 칸이 하나씩 끼어 있다.
  #     | 개정번호 |  | 일시 |  | 해당 절 |  | 개정 사유 |  | 담당자 |  | 승인자 |
  # 열 이름으로 맞추므로 빈 칸은 상관없다. 개정번호가 빈 행은 빈 양식 행이라 뺀다.
  - name: 개정기록
    from: table_rows
    columns: [개정번호, 일시, 해당 절, 개정 사유, 담당자, 승인자]
    required_columns: [개정번호, 일시, 해당 절, 개정 사유, 담당자, 승인자]
    required: true

# ── 공통으로 올라간 항목 (2026-08-20) ────────────────────────────────
# 아래 넷은 공통 기준이 같은 검사를 하므로 여기서 뺐다. **공통 C1~C4 의 근거가
# 바로 이 항목들의 본문**이다 — 두 실이 같은 것을 요구했다는 증거로 인용했다.
#
#   No.26 용어 및 약어 정의 확인   → 공통 C2 (규칙 abbrev)
#   No.27 오탈자 및 맞춤법 확인    → 공통 C1 (LLM-조각)
#   No.30 용어 사용 일관성 확인    → 공통 C4 (LLM-문서)
#   No.35 표·그림 번호 정합성      → 공통 C3 (LLM-문서)
#
# 남겨두면 같은 지적이 기준 둘에 붙어 화면에 두 건으로 보이고, LLM-문서 는
# 문서 전체를 한 번 더 묻는다. 이 팀의 검토 결과는 **지적 목록**이라 항목이
# 사라져도 잃는 것이 없다 — AX품질팀처럼 항목마다 판정을 적어야 하는 팀은
# 다르다(그쪽은 IEEE 1012 체크리스트가 산출물이라 못 뺀다).
#
# 원문은 요구사항 xlsx 의 EIS 문서 검증 요구사항 시트 No.26·27·30·35 에 있다.
name: 에너지검증 2팀
team: EV2
source_filename: DocSuree_요구사항_정리.xlsx
items:
- 'no': '17'
  group: 문서 표준 준수
  text: 워드 서식 준수 여부 (IS16-FRM-2010)
  note: |-
    문서 작성 전 IS16-FRM-2010-워드서식문서를 기준으로 문서 제목, 머리말/꼬리말, 글꼴, 문단 스타일, 표/그림 형식, 목차 구성, 페이지 번호 형식이 표준 서식과 일치하는지 확인하는 행위를 자동화한다.
    1. 검토 대상 문서가 IS16-FRM-2010-워드서식문서에서 정의한 기본 문서 구조를 따르는지 확인한다.
    2. 표지, 개정기록, 목차, 본문, 부록 등 필수 구성요소가 정해진 순서로 배치되어 있는지 확인한다.
    3. 제목, 본문, 표, 그림, 캡션, 머리말/꼬리말의 스타일이 표준 서식과 일치하는지 확인한다.
    4. 표준 서식과 다르게 수동 변경된 부분을 위치와 함께 식별한다.
  agent: 표준·체크리스트
  source: EIS문서검증 No.17
- 'no': '18'
  group: 문서 표준 준수
  text: 표준화 가이드 준수 여부 (IS24-GDL-0000)
  note: |-
    문서 작성 전 IS24-GDL-0000 문서 표준화 가이드를 기준으로 고객사 납품용 문서의 구성, 구조, 세부사항을 만족해야 한다.
    1. 검토 대상 문서가 IS16-FRM-2010-워드서식문서에서 정의한 기본 문서 구조를 따르는지 확인한다.
    2. 표지, 개정기록, 목차, 본문, 부록 등 필수 구성요소가 정해진 순서로 배치되어 있는지 확인한다.
    3. 제목, 본문, 표, 그림, 캡션, 머리말/꼬리말의 스타일이 표준 서식과 일치하는지 확인한다.
    4. 표준 서식과 다르게 수동 변경된 부분을 위치와 함께 식별한다.
  agent: 표준·체크리스트
  source: EIS문서검증 No.18
- 'no': '19'
  group: 표지·개정·목차
  text: 파일명 양식 확인
  note: |-
    제출 문서의 파일명이 문서유형, 프로젝트명, 산출물명, 버전, 개정번호 등 내부 규칙에 맞게 작성되었는지 확인하고, 누락되거나 순서가 다른 요소를 식별한다.
    1. 파일명에 프로젝트명, 문서유형, 산출물명, 버전, 개정번호 등 필요한 식별자가 포함되어 있는지 확인한다.
    2. 파일명의 구성요소 순서와 구분자가 내부 규칙에 맞는지 확인한다.
    3. 파일명과 표지의 문서명, 문서번호, 버전 정보가 일치하는지 확인한다.
    4. 임시 파일명, 개인 작업 표시, 중복본 표시, 불필요 특수문자를 식별한다.
  agent: 형식·완전성
  source: EIS문서검증 No.19
  mode: 규칙
  check: filename
  # **params 를 일부러 비워 두었다.** 본문은 "내부 규칙에 맞게"까지만 말하고 그
  # 규칙이 무엇인지는 어디에도 없다. 형식을 지어내면 멀쩡한 파일명이 전부 틀린
  # 것으로 뜬다. 지금은 "파일명 규칙이 기준에 없어 검사하지 않았습니다"로 뜨고,
  # 팀이 규칙을 알려주면 아래 두 줄만 채우면 돈다(EV3 13번이 그 예다).
  #
  #   params:
  #     filename_pattern: '...'
  #     filename_forbidden: [사본, 최종, ...]   # 4번(임시·중복본 표시)
  #
  # 3번(파일명과 표지 정보 일치)은 표지 문서번호를 아직 못 뽑아 별개 과제다.
- 'no': '20'
  group: 표지·개정·목차
  text: 표지 정보 확인
  note: |-
    표지의 문서명, 문서번호, 프로젝트명, 고객사명, 작성/검토/승인 정보, 개정번호, 작성일자가 문서 본문 및 파일명과 일치하는지 확인한다.
    1. 표지에 문서명, 문서번호, 프로젝트명, 고객사명, 대상 시스템명이 작성되어 있는지 확인한다.
    2. 표지의 문서명, 버전, 개정번호가 파일명 및 개정기록 최신 정보와 일치하는지 확인한다.
    3. 작성자, 검토자, 승인자, 작성일, 검토일, 승인일이 누락 없이 작성되어 있는지 확인한다.
    4. 이전 프로젝트명, 이전 고객사명, 이전 문서번호가 남아 있는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.20
  mode: 규칙
  check: field_presence
  # 위 outputs 절이 실측(SKN56_CDMS_RVVR_Rev08.docx 표지)으로 적어 둔 칸 중
  # **이 항목 몫**만 고른다. 3번 항목(작성/검토/승인 정보)이 여기 해당한다.
  #
  # 1·2·4번(문서명·문서번호·프로젝트명·고객사명, 파일명과의 일치, 이전 정보 잔존)은
  # 아직 못 뽑는다 — 표지 첫 행에 라벨 없이 한 칸에 뭉쳐 있다. outputs 절 머리
  # 주석의 "다루지 못한 것" 참고. 그래서 이 항목의 결과는 3번에 대한 것뿐이다.
  params:
    fields: [작성자, 검토자, 승인자, 발행일]
- 'no': '21'
  group: 표지·개정·목차
  text: 개정기록 완전성 확인
  note: |-
    개정기록 표에 개정번호, 개정일자, 작성자, 변경 내용, 승인 정보가 누락 없이 작성되었는지 확인하고, 문서 내 개정바 또는 변경 이력과 불일치하는 항목을 식별한다.
    1. 개정기록 표가 문서 앞부분의 지정된 위치에 존재하는지 확인한다.
    2. 개정번호, 개정일자, 개정 내용, 작성자, 승인자 항목이 누락 없이 작성되어 있는지 확인한다.
    3. 최신 개정번호가 표지의 개정번호와 일치하는지 확인한다.
    4. 개정 내용이 실제 본문 변경 사항 및 개정바 위치와 대응되는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.21
  mode: 규칙
  check: field_presence
  # 표의 **모든 행**을 본다(outputs 의 개정기록, from: table_rows). 20번과 검사
  # 이름은 같지만 보는 칸이 달라 검사기도 따로 만들어진다 — 한 벌을 나눠 가지면
  # 표지 지적이 개정기록 항목에도 뜬다.
  #
  # 3·4번(표지 개정번호와 일치, 본문 개정바와 대응)은 못 한다. 표지 개정번호를
  # 못 뽑고(위 참고), 개정바는 이전 개정본이 있어야 안다.
  params:
    fields: [개정기록]
- 'no': '22'
  group: 표지·개정·목차
  text: 개정바 표시 확인
  note: |-
    문서 개정 시 변경된 본문, 표, 그림, 부록 위치에 개정바가 표시되어 있는지 확인하고, 개정기록에는 변경 내용이 있으나 본문에 표시가 없는 경우를 식별한다.
    1. 이전 버전 문서와 현재 버전 문서를 비교하여 변경된 문장, 표, 그림, 부록 위치를 식별한다.
    2. 변경된 위치에 개정바가 표시되어 있는지 확인한다.
    3. 개정바가 표시되었지만 실제 변경 내용이 없는 위치를 식별한다.
  agent: 형식·완전성
  source: EIS문서검증 No.22
- 'no': '23'
  group: 표지·개정·목차
  text: 목차 및 페이지 번호 확인
  note: |-
    자동 목차의 제목, 절 번호, 페이지 번호가 본문 제목 및 실제 페이지와 일치하는지 확인하고, 누락된 제목이나 잘못 연결된 페이지를 식별한다.
    1. 목차가 자동 목차 기능으로 생성되어 있는지 확인한다.
    2. 목차의 장, 절, 항 제목과 절 번호가 본문과 일치하는지 확인한다.
    3. 목차의 페이지 번호가 실제 Word/PDF 페이지와 일치하는지 확인한다.
    4. 본문에는 있으나 목차에 누락된 제목 또는 목차에는 있으나 본문에 없는 제목을 식별한다.
  agent: 형식·완전성
  source: EIS문서검증 No.23
- 'no': '24'
  group: 표지·개정·목차
  text: 목적·범위 작성 여부
  note: |-
    목적과 범위 항목이 비어 있거나 형식적인 문장으로만 작성되어 있지 않은지 확인하고, 문서 대상 시스템·기능·검증 범위가 명시되어 있는지 확인한다.
    1. 목적 항목에 문서를 작성하는 이유와 활용 목적이 작성되어 있는지 확인한다.
    2. 범위 항목에 대상 시스템, 대상 기능, 대상 산출물 또는 대상 검증 활동이 명시되어 있는지 확인한다.
    3. 검증 제외 범위가 필요한 문서의 경우 제외 대상이 명확히 작성되어 있는지 확인한다.
  # **규칙이 아니라 내용 판단이다.** 본문이 "비어 있거나 **형식적인 문장으로만**
  # 작성되어 있지 않은지" 를 묻는다 — 절이 있는지(규칙)가 아니라 그 안의 말이
  # 실질적인지를 본다. 라벨 기본값(형식·완전성 → 규칙)에 맡기면 "검사하는 규칙이
  # 아직 없습니다" 로 떨어져, 원리상 규칙이 될 수 없는 것을 미구현처럼 보이게 한다.
  agent: 표현·내용품질
  mode: LLM-문서
  source: EIS문서검증 No.24
- 'no': '25'
  group: 표지·개정·목차
  text: 참조문서 목록 확인
  note: |-
    참조문서 표의 문서명, 문서번호, 버전, 발행처가 누락 없이 작성되었는지 확인하고, 본문에서 언급한 참조문서가 목록에 없거나 목록에만 있고 본문에서 사용되지 않는 항목을 식별한다.
    1. 참조문서별 문서명, 문서번호, 버전, 발행처가 누락 없이 작성되어 있는지 확인한다.
    2. 본문에서 언급한 문서가 참조문서 목록에 포함되어 있는지 확인한다.
    3. 참조문서 목록에 있으나 본문에서 사용되지 않는 문서를 식별한다.
    4. 동일 문서가 서로 다른 이름이나 버전으로 중복 등록되어 있는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.25
  mode: 규칙
  check: reflist
