  text: PDF 책갈피 확인
  note: |-
    PDF 책갈피가 문서 목차 구조와 동일하게 생성되었는지 확인하고, 누락된 장, 잘못 연결된 페이지, 불필요한 책갈피를 식별한다.
    1. PDF에 책갈피가 생성되어 있는지 확인한다.
    2. 책갈피의 계층 구조가 목차의 장, 절 구조와 일치하는지 확인한다.
    3. 책갈피를 클릭했을 때 올바른 페이지로 이동하는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.44
- 'no': '45'
  group: 발행 전 점검
  text: PDF 링크 확인
  note: |-
    PDF 내 목차 링크, 본문 상호참조 링크, 외부 문서 링크가 정상적으로 이동하는지 확인하고, 깨진 링크 또는 잘못된 대상 페이지를 식별한다.
    1. PDF 목차 항목에 링크가 적용되어 있는지 확인한다.
    2. 목차 링크와 본문 상호참조 링크가 올바른 위치로 이동하는지 확인한다.
    3. 외부 문서 또는 URL 링크가 정상적으로 열리는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.45
- 'no': '46'
  group: 발행 전 점검
  text: 스캔 병합 상태 확인
  note: |-
    서명본 스캔 페이지가 원본 PDF의 올바른 위치에 병합되었는지 확인하고, 중복 삽입, 누락, 회전, 해상도 저하, 페이지 순서 오류를 식별한다.
    1. 스캔 병합이 필요한 문서인지 확인한다.
    2. 원본 PDF와 병합 후 PDF의 페이지 수를 비교한다.
    3. 서명 스캔 페이지가 지정 위치에 삽입되었는지 확인한다.
  agent: 형식·완전성
  source: EIS문서검증 No.46
- 'no': '47'
  group: 문장 표현
  text: MEMO 문서 형식 확인
  note: |-
    MEMO 문서의 수신자, 발신자, 제목, 문서번호, 날짜, 본문 형식, 첨부 문서 목록이 내부 양식에 맞게 작성되었는지 확인한다.
    1. 검토 대상 문서가 MEMO 문서인지 확인한다.
    2. 수신자, 발신자, 제목, 문서번호, 작성일자가 누락 없이 작성되어 있는지 확인한다.
    3. 첨부 문서 목록과 실제 첨부 파일명이 일치하는지 확인한다.
    4. MEMO 세부 양식 기준은 MEMO 작성용 엑셀파일 내에 있으며, 아래 파일을 기준으로 한다.
    - Z00000-010GM-001D-I&C 업체교신체계_Rev.06
  agent: 표현·내용품질
  source: EIS문서검증 No.47
- 'no': '48'
  group: 발행 전 점검
  text: 산출물 발행 전 최종 점검
  note: |-
    파일명, 표지, 개정기록, 목차, 본문, 부록, 참조문서, PDF 변환, 서명본 병합, 책갈피까지 최종 발행 전 확인해야 할 항목을 순차적으로 점검하고 누락 항목을 보고한다.
    1. 제출 대상 파일 목록이 모두 준비되었는지 확인한다.
    2. 파일명, 표지, 개정기록, 목차, 본문, 부록, 참조문서 항목을 순차적으로 확인한다.
    3. PDF 변환, 서명본 스캔, 병합, 책갈피, 링크 상태를 확인한다.
    4. 최종 제출 전 미해결 오류와 확인 완료 항목을 보고서로 정리한다.
    5. 아래 체크리스트 만족 여부를 확인해야 한다. 만족하지 못할 시 비고란에 사유를 기재해야 한다.
     - [첨부] MQLT_SW V&V 외주업체간 산출 결과물 표준화 Checklist_시검팀_250718
  agent: 문서작성·생성
  source: EIS문서검증 No.48
- 'no': '49'
  group: 작성 지원
  text: TC 설계 보조
  note: |-
    요구사항 또는 설계 항목을 기준으로 테스트 케이스 ID, 목적, 사전조건, 입력값, 기대결과, 판정 기준 초안을 생성하고 추적성 누락 여부를 함께 확인한다.
    1. 요구사항 또는 설계 항목에서 테스트 대상 기능을 추출한다.
    2. 테스트 케이스 ID, 테스트 목적, 사전조건, 입력값을 생성한다.
    3. 기대결과와 판정 기준을 요구사항 문장에 맞춰 작성한다.
    4. TC 작성 규칙과 ID 부여 기준은 해당 계통 시험 계획서에 담겨있다.
  agent: 문서작성·생성
  source: EIS문서검증 No.49
