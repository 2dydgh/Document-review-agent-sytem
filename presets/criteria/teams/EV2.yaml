     - 기본적으로 시험검증팀의 모든 문서는 1.0 Purpose, 2.0 Scpoe, 3.0 References, 4.0 Definitions and Abbreviations 으로 구성된다.
     - 각 문서의 작성 가이드 표준 (예: SVVP 는 IEEE 1012) 을 준수해야 한다. (최소한 맵핑되어야 한다)
