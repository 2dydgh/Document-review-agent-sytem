  # 예전에는 **공통 기준**이 이 검사를 켜고 팀은 값만 줬다. 공통을 다시 짜면서
  # (2026-08-20) 필수 장절을 뺐다 — 목록이 팀마다 달라 값 없는 팀에서는
  # "검사하지 않았습니다"만 뜨는 공허한 공통 기준이었다. 이제 값을 가진 기준이
  # 스스로 켠다.
  mode: 규칙
  check: required_sections
  # 위 본문 "기본적으로 시험검증팀의 모든 문서는 1.0 Purpose, 2.0 Scpoe,
  # 3.0 References, 4.0 Definitions and Abbreviations 으로 구성된다" 를 검사기가
  # 쓸 수 있는 값으로 옮긴 것이다. 옛 presets/checklists/rvvr-standard.yaml 이
  # 같은 값을 갖고 있었지만 근거가 이 항목이므로 여기 둔다.
  #
  # 표기는 본문 그대로 두지 않았다 — "Scpoe" 는 오타이고, 검사기는 문서의 실제
  # 제목과 글자로 대조하므로 오타를 그대로 넣으면 멀쩡한 문서를 지적한다.
  # 번호로 절을 찾고 제목은 따로 대조하므로(CompletenessChecker) 제목 표현이
  # 흔들려도 MAJOR 가 아니라 MINOR 다.
  params:
    required_sections:
      - "1.0 Purpose"
      - "2.0 Scope"
      - "3.0 References"
      - "4.0 Definitions and Abbreviations"
